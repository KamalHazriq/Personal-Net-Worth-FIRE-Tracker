name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    # Pinned rather than ubuntu-latest: that label moves to Ubuntu 26 from
    # 2026-10-19, and a runner image changing under a green build is not a
    # surprise worth having. Bump this deliberately.
    runs-on: ubuntu-24.04
    strategy:
      # Report every Node version independently instead of cancelling the rest
      # as soon as one fails.
      fail-fast: false
      matrix:
        node-version: [18, 22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Type check server
        run: npx tsc --noEmit -p server/tsconfig.json
      - name: Type check client
        run: npx tsc --noEmit -p client/tsconfig.json
      - name: Unit tests
        run: npm test
      - name: Build client
        run: npm run build
